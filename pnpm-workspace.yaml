packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  '@reown/appkit': true
  esbuild: true
  protobufjs: true
  unrs-resolver: true

catalog:
  '@types/bun': '^1.1.0'
  typescript: '^7.0.2'
  zod: '^3.23.8'
  hono: '^4.13.7'
  better-auth: '^1.7.9'
  '@orpc/server': '^1.15.7'
  '@orpc/client': '^1.15.7'
  '@orpc/zod': '^1.15.7'
  '@orpc/openapi': '^1.15.7'
  varlock: '^1.23.0'
  viem: '^2.57.7'
  drizzle-zod: '^0.8.3'
  drizzle-orm: '0.45.4'

minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.9'
  - '@better-auth/drizzle-adapter@1.7.9'
  - '@better-auth/kysely-adapter@1.7.9'
  - '@better-auth/memory-adapter@1.7.9'
  - '@better-auth/mongo-adapter@1.7.9'
  - '@better-auth/prisma-adapter@1.7.9'
  - '@better-auth/telemetry@1.7.9'
  - '@orpc/client@1.15.7'
  - '@orpc/contract@1.15.7'
  - '@orpc/interop@1.15.7'
  - '@orpc/json-schema@1.15.7'
  - '@orpc/openapi-client@1.15.7'
  - '@orpc/openapi@1.15.7'
  - '@orpc/server@1.15.7'
  - '@orpc/shared@1.15.7'
  - '@orpc/standard-server-aws-lambda@1.15.7'
  - '@orpc/standard-server-fastify@1.15.7'
  - '@orpc/standard-server-fetch@1.15.7'
  - '@orpc/standard-server-node@1.15.7'
  - '@orpc/standard-server-peer@1.15.7'
  - '@orpc/standard-server@1.15.7'
  - '@orpc/zod@1.15.7'
  - better-auth@1.7.9
  - viem@2.57.7
  
overrides:
  drizzle-orm: 0.45.4