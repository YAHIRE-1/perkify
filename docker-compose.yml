services:
  db:
    image: postgres:16-alpine
    container_name: perkify-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: perkify
    ports:
      - "5439:5432"
    volumes:
      - perkify_pgdata:/var/lib/postgresql/data

volumes:
  perkify_pgdata:
